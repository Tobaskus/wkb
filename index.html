<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medaillenspiegel Live</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1b1f24;--muted:#5d6670;--line:#e2e5ea;--row:#fafbfc;--accent:#c8102e;
  --gold:#d4a514;--silver:#9aa3ad;--bronze:#b06a35;--primaer:var(--text);
  /* Beamer */
  --b-bg:#0f1215;--b-karte:#181d22;--b-linie:#2a3038;--b-text:#f1f3f5;--b-muted:#8f99a3;--b-titel:#ffd75e;--b-akzent:#ffd75e;
}
/* ===================== Design: KFVL Sächsische Schweiz-Osterzgebirge ===================== */
:root[data-design="kfvl-so"]{
  --bg:#f2f5f9;--card:#fff;--text:#13233a;--muted:#56677c;--line:#dbe3ed;--row:#f5f8fc;
  --accent:#b8261b;--primaer:#013d77;
  --b-bg:#03264b;--b-karte:#0a3463;--b-linie:#1c4a7d;--b-text:#fff;--b-muted:#a9bfd8;--b-titel:#fff;--b-akzent:#e0463a;
}
@media (prefers-color-scheme: dark){
  :root[data-design="kfvl-so"]:not([data-theme="light"]){
    --bg:#0c1520;--card:#13202f;--text:#e7edf4;--muted:#9babbd;--line:#223449;--row:#182739;--accent:#ff6b5e;--primaer:#9cc3f5;
  }
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121417;--card:#1b1e22;--text:#e8eaed;--muted:#9aa2ab;--line:#2c3036;--row:#202429;--accent:#ff4d5e;}
}
:root[data-theme="dark"]{--bg:#121417;--card:#1b1e22;--text:#e8eaed;--muted:#9aa2ab;--line:#2c3036;--row:#202429;--accent:#ff4d5e;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:0 0 2px;color:var(--primaer)}
.kopf{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.kopf .sub{margin-bottom:0}
.logo{flex:0 0 auto;display:block;background:#fff;border-radius:8px;padding:6px 8px;line-height:0}
.logo img{height:60px;width:auto}
:root[data-design="kfvl-so"] .kopf{background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--accent);
  border-radius:10px;padding:12px 16px}
:root[data-design="kfvl-so"] .card-head h2{color:var(--primaer)}
:root[data-design="kfvl-so"] .card th{color:var(--primaer)}
.ort{font-size:1rem;font-weight:600;margin-bottom:2px}
h2{font-size:1rem;margin:0}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:12px}
.nav{display:flex;gap:4px;overflow-x:auto;box-shadow:inset 0 -2px 0 var(--line);margin-bottom:14px}
.nav a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.nav a.on{color:var(--text);border-color:var(--accent)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.filters label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:3px}
.filters input{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.filters select{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.hint{color:var(--muted);font-size:.82rem;margin:-4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 14px 10px;margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;padding:8px 0 4px}
.card-head small{color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--row);border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
th{font-size:.78rem;color:var(--muted);font-weight:600}
td.n,th.n{text-align:center;width:56px}
td.r,th.r{text-align:right}
td.name{white-space:normal;min-width:150px}
td.wrap{white-space:normal}
td small,.muted{color:var(--muted)}
tbody tr.main{cursor:pointer}
tbody tr.main:hover{background:var(--row)}
tbody tr.flash{animation:fl 2.5s}
@keyframes fl{0%{background:#ffe58a55}100%{background:transparent}}
.m{display:inline-block;width:22px;height:22px;border-radius:50%;line-height:22px;text-align:center;font-size:.72rem;font-weight:700;color:#fff}
.m.g{background:var(--gold)}.m.s{background:var(--silver)}.m.b{background:var(--bronze)}
td.g{font-weight:700}
tr.detail td{background:var(--row);white-space:normal;font-size:.86rem}
.det{display:grid;gap:3px}
.det div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.det small{color:var(--muted)}
.empty{color:var(--muted);padding:14px 0}
.person{all:unset;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.person:hover{color:var(--accent)}
.person:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.zuruecksetzen{all:unset;cursor:pointer;font-size:.82rem;color:var(--accent);margin:-6px 0 12px;display:inline-block}
.warnung{background:#fff4d6;color:#6b4e00;border:1px solid #f0d58a;border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:.9rem}
.fuss{margin-top:18px;font-size:.82rem;color:var(--muted)}
.fuss a{color:var(--muted)}
/* Beamer */
body.beamer{background:var(--b-bg);color:var(--b-text);font-size:clamp(16px,1.6vw,30px)}
body.beamer .wrap{max-width:none;padding:2vh 3vw}
body.beamer .normal{display:none}
#viewBeamer{display:none}
body.beamer #viewBeamer{display:block}
.b-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:2vw;margin-bottom:2vh}
.b-kopf h1{font-size:2.1em;margin:0;color:var(--b-text)}
.b-kopf{align-items:center}
.b-kopf .logo img{height:2.6em}
.b-links{display:flex;align-items:center;gap:1.2vw}
.b-kopf .ort{font-size:1.1em;color:var(--b-muted);font-weight:600}
.b-uhr{font-size:2.1em;font-weight:700;font-variant-numeric:tabular-nums}
.b-titel{font-size:1.35em;font-weight:700;margin:0 0 1.5vh;color:var(--b-titel);border-left:.25em solid var(--b-akzent);padding-left:.5em}
.b-tab{width:100%;border-collapse:collapse}
.b-tab td,.b-tab th{border-bottom:1px solid var(--b-linie);padding:.45em .5em;font-size:1em}
.b-tab th{color:var(--b-muted);font-size:.75em}
.b-tab td.n,.b-tab th.n{text-align:center;width:4em}
.b-tab .m{width:1.5em;height:1.5em;line-height:1.5em;font-size:.75em}
.b-raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(32vw,1fr));gap:1.6vh 2vw}
.b-karte{background:var(--b-karte);border:1px solid var(--b-linie);border-radius:.5em;padding:.6em .9em}
.b-karte h2{font-size:1.1em;margin:0 0 .2em;color:var(--b-text)}
.b-karte small{color:var(--b-muted)}
.b-karte table{width:100%;border-collapse:collapse;margin-top:.3em}
.b-karte td{padding:.2em .3em;border:0;white-space:normal;line-height:1.25}
.b-karte h2 small{font-weight:400;font-size:.75em}
.b-karte td.r{text-align:right;font-weight:700;white-space:nowrap}
.b-punkte{display:flex;gap:.5em;justify-content:center;margin-top:2vh}
.b-punkte span{width:.6em;height:.6em;border-radius:50%;background:var(--b-linie)}
.b-punkte span.on{background:var(--b-akzent)}
body.beamer .warnung{font-size:.8em}
@media (max-width:560px){.kopf{flex-direction:column;align-items:flex-start;gap:8px}.logo img{height:44px}.nav a{padding:8px 9px}th,td{padding:6px 5px}td.n,th.n{width:38px}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="kopf normal">
    <a class="logo" id="logoLink" target="_blank" rel="noopener" hidden><img id="logo" alt=""></a>
    <div>
      <h1 id="title">Medaillenspiegel</h1>
      <div class="ort" id="datumOrt"></div>
      <div class="sub" id="stand">Lade Ergebnisse…</div>
    </div>
  </header>
  <div class="warnung" id="warnung" hidden></div>
  <nav class="nav normal">
    <a href="#medaillen" id="navMed">Medaillenspiegel</a>
    <a href="#ergebnisse" id="navErg">Ergebnisse</a>
    <a href="#meldungen" id="navMeld">Meldungen</a>
  </nav>
  <section id="viewMed" class="normal">
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th class="n">#</th><th id="colName">Verein</th>
            <th class="n"><span class="m g">G</span></th>
            <th class="n"><span class="m s">S</span></th>
            <th class="n"><span class="m b">B</span></th>
            <th class="n">Σ</th>
          </tr></thead>
          <tbody id="medBody"></tbody>
        </table>
      </div>
    </div>
  </section>
  <section id="viewErg" class="normal" hidden>
    <div class="filters">
      <div><label for="selKlasse">Altersklasse</label><select id="selKlasse"></select></div>
      <div><label for="selDisz">Disziplin</label><select id="selDisz"></select></div>
      <div><label for="selVerein">Verein</label><select id="selVerein"></select></div>
      <div><label for="suche">Name</label><input id="suche" type="search" placeholder="z. B. Wegner oder Till Wegner" autocomplete="off"></div>
    </div>
    <button type="button" class="zuruecksetzen" id="zuruecksetzen" hidden>Alle Filter zurücksetzen</button>
    <div id="ergListe"></div>
  </section>
  <section id="viewBeamer">
    <div class="b-kopf"><div class="b-links"><span class="logo" id="bLogoRahmen" hidden><img id="bLogo" alt=""></span><div><h1 id="bTitel"></h1><div class="ort" id="bOrt"></div></div></div><div class="b-uhr" id="bUhr"></div></div>
    <div id="bInhalt"></div>
    <div class="b-punkte" id="bPunkte"></div>
  </section>
  <div class="fuss normal"><a href="#beamer">Beamer-Ansicht</a> (Vollbild: Doppelklick, Beenden: Esc)</div>
</div>

<script>
(() => {
  // ===================== EINSTELLUNGEN =====================
  // Welcher Wettkampf abgeholt wird, steht in .github/workflows/aktualisieren.yml (ERGEBNIS_URL).
  const CONFIG = {
    // Design: 'standard' oder ein Name aus DESIGNS (unten). Über die Adresse wählbar: ...?design=kfvl-so
    design: 'standard',
    // Von GitHub aufbereitete Ergebnisse (liegen neben dieser Datei)
    quelle: 'daten/ergebnisse.json',
    // Kleine Datei, die nur sagt, ob es neue Daten gibt (spart Datenvolumen)
    versionQuelle: 'daten/version.json',
    // Wie oft der Browser nachschaut, in Sekunden (0 = aus)
    interval: 60,
    // Wertung: 'club' = nach Verein, 'lv' = nach Landesverband
    mode: 'club',
    // Vorläufe auf der Ergebnisseite anzeigen? (zählen nie für Medaillen)
    vorlaeufeZeigen: true,
    // Ergebnisse erst übernehmen, wenn sie seit so vielen Minuten offiziell sind
    wartezeitMinuten: 5,
    // Hinweis, wenn am Wettkampftag so viele Minuten keine Aktualisierung kam
    veraltetMinuten: 15,
    // Beamer: Sekunden pro Ansicht, Anzahl neuester Ergebnisse
    beamerSekunden: 20,
    beamerErgebnisse: 6
  };
  // =========================================================

  // ===================== DESIGNS =====================
  // Farben stehen oben im <style> unter :root[data-design="..."]; hier Logo, Name und Link.
  const DESIGNS = {
    'standard': {},
    'kfvl-so': {
      logo: 'designs/kfvl-so/logo.png',
      name: 'Kreisfachverband Leichtathletik Sächsische Schweiz-Osterzgebirge e.V.',
      link: 'https://www.leichtathletik-so.de/'
    }
  };
  const designName = (() => {
    const n = (new URLSearchParams(location.search).get('design') || CONFIG.design || 'standard').toLowerCase();
    return DESIGNS[n] ? n : 'standard';
  })();
  const DESIGN = DESIGNS[designName];
  document.documentElement.dataset.design = designName;
  // =========================================================

  const GESAMT = '__gesamt__', ALLE = '__alle__';

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const medal = r => `<span class="m ${r === 1 ? 'g' : r === 2 ? 's' : 'b'}">${r}</span>`;
  const store = { get(k){ try { return localStorage.getItem('msp_' + k); } catch (e) { return null; } },
                  set(k, v){ try { localStorage.setItem('msp_' + k, v); } catch (e) {} } };

  let data = null, open = new Set(), prevTotals = null;
  let klasse = store.get('klasse') || ALLE;
  let disziplin = store.get('disziplin') || ALLE;
  let verein = store.get('verein') || ALLE;
  let suche = '';
  // Suche: Groß/Klein und Akzente egal, alle Wörter müssen vorkommen (Reihenfolge egal: "Till Wegner" findet "Wegner Till")
  const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ß/g, 'ss');
  const passtZurSuche = e => {
    const woerter = norm(suche).split(/\s+/).filter(Boolean);
    const text = norm(e.name + ' ' + (e.mitglieder || ''));
    return woerter.every(w => text.includes(w));
  };
  const klassenName = code => (data.klassen.find(k => k.code === code) || {}).name || code;
  // Kurzform für Titel: MJU18, W, M13, X …
  const kurz = code => code;
  // Klassen immer in der Reihenfolge von data.klassen (M, W, MJU20, …)
  const sortCodes = codes => codes.slice().sort((a, b) => {
    const i = c => { const x = data.klassen.findIndex(k => k.code === c); return x < 0 ? 999 : x; };
    return i(a) - i(b);
  });
  const klassenCodes = w => sortCodes(Object.keys(w.klassen).filter(c => w.klassen[c].length));
  const titelKlasse = (w, code) => `${w.disziplin} ${kurz(code)}`;
  // nur Ergebnisse, die seit mindestens CONFIG.wartezeitMinuten offiziell sind
  const freigegeben = w => !!w.offiziell && Date.now() - new Date(w.offiziell).getTime() >= CONFIG.wartezeitMinuten * 60000;

  // ---------- Medaillen ----------
  function saetze() {
    // je Wettbewerb und Altersklasse ein Medaillensatz: {titel, eintraege}
    const out = [];
    data.wettbewerbe.forEach(w => {
      if (w.vorlauf || !freigegeben(w)) return;
      klassenCodes(w).forEach(c => out.push({ titel: titelKlasse(w, c), eintraege: w.klassen[c] }));
    });
    return out;
  }

  function spiegel() {
    const table = {};
    saetze().forEach(({ titel, eintraege }) => eintraege.forEach(en => {
      if (!en.rang || en.rang > 3) return;
      const key = (CONFIG.mode === 'lv' ? en.lv : en.verein) || '(unbekannt)';
      const t = table[key] || (table[key] = { name: key, g: 0, s: 0, b: 0, items: [] });
      t[en.rang === 1 ? 'g' : en.rang === 2 ? 's' : 'b']++;
      t.items.push({ r: en.rang, en, titel });
    }));
    const rows = Object.values(table).sort((a, b) =>
      b.g - a.g || b.s - a.s || b.b - a.b || a.name.localeCompare(b.name, 'de'));
    rows.forEach((r, i) => {
      const p = rows[i - 1];
      r.pos = p && p.g === r.g && p.s === r.s && p.b === r.b ? p.pos : i + 1;
    });
    return rows;
  }

  function renderMedaillen() {
    $('colName').textContent = CONFIG.mode === 'lv' ? 'Landesverband' : 'Verein';
    const totals = {};
    const rows = spiegel();
    $('medBody').innerHTML = rows.map(r => {
      const sig = `${r.g}/${r.s}/${r.b}`;
      totals[r.name] = sig;
      const changed = prevTotals && prevTotals[r.name] !== sig;
      let h = `<tr class="main${changed ? ' flash' : ''}" data-k="${esc(r.name)}">
        <td class="n">${r.pos}</td><td class="name">${esc(r.name)}</td>
        <td class="n g">${r.g}</td><td class="n">${r.s}</td><td class="n">${r.b}</td><td class="n"><b>${r.g + r.s + r.b}</b></td></tr>`;
      if (open.has(r.name)) {
        h += `<tr class="detail"><td></td><td colspan="5"><div class="det">${r.items.slice().sort((a, b) => a.r - b.r).map(it =>
          `<div>${medal(it.r)} <span>${esc(it.titel)}</span>
           <small>${esc(it.en.team ? 'Staffel' : it.en.name)}${CONFIG.mode === 'lv' && !it.en.team ? ' (' + esc(it.en.verein) + ')' : ''} · ${esc(it.en.ergebnis)}</small></div>`).join('')}</div></td></tr>`;
      }
      return h;
    }).join('') || `<tr><td colspan="6" class="empty">Noch keine Medaillen vergeben.</td></tr>`;
    prevTotals = totals;
  }

  // ---------- Ergebnisse & Meldungen (gleicher Aufbau, gleiche Filter) ----------
  const ARTEN = {
    erg: {
      // Wettbewerbe, die angezeigt werden
      wettbewerbe: () => data.wettbewerbe.filter(w => freigegeben(w) && (CONFIG.vorlaeufeZeigen || !w.vorlauf)),
      codes: w => klassenCodes(w),
      proKlasse: (w, c) => w.klassen[c] || [],
      gesamt: w => w.gesamt,
      gesamtOption: 'Gesamtwertungen (gemeinsame Wettbewerbe)',
      gesamtKommentar: 'Gesamtwertung über alle Altersklassen',
      leer: 'Noch keine Ergebnisse.'
    },
    meld: {
      wettbewerbe: () => data.wettbewerbe.filter(w => w.meldungenZeigen),
      codes: w => sortCodes([...new Set(w.meldungen.map(e => e.klasse).filter(Boolean))]),
      proKlasse: (w, c) => w.meldungen.filter(e => e.klasse === c),
      gesamt: w => new Set(w.meldungen.map(e => e.klasse)).size > 1 ? w.meldungen : null,
      gesamtOption: 'Gemeinsame Wettbewerbe (alle Klassen zusammen)',
      gesamtKommentar: 'alle Altersklassen zusammen',
      leer: 'Noch keine Meldungen.'
    }
  };

  function optionen(sel, liste, wert) {
    $(sel).innerHTML = liste.map(([v, l]) => `<option value="${esc(v)}"${v === wert ? ' selected' : ''}>${esc(l)}</option>`).join('');
  }

  function renderListe(art) {
    const A = ARTEN[art];
    const liste = A.wettbewerbe();

    // Altersklassen-Auswahl
    const vorhanden = new Set();
    liste.forEach(w => A.codes(w).forEach(c => vorhanden.add(c)));
    const optK = [[ALLE, 'Alle Altersklassen']];
    data.klassen.forEach(k => vorhanden.has(k.code) && optK.push([k.code, k.name]));
    vorhanden.forEach(c => { if (!optK.some(o => o[0] === c)) optK.push([c, c]); });
    if (liste.some(w => A.gesamt(w))) optK.push([GESAMT, A.gesamtOption]);
    let kl = optK.some(o => o[0] === klasse) ? klasse : ALLE;
    optionen('selKlasse', optK, kl);

    // Karten (Wettbewerb × Klasse)
    let karten = [];
    if (kl === GESAMT) {
      liste.forEach(w => { const g = A.gesamt(w); if (g) karten.push({ w, code: GESAMT, eintraege: g }); });
    } else {
      const codes = kl === ALLE ? optK.map(o => o[0]).filter(c => c !== ALLE && c !== GESAMT) : [kl];
      codes.forEach(c => liste.forEach(w => {
        const e = A.proKlasse(w, c);
        if (e.length) karten.push({ w, code: c, eintraege: e });
      }));
    }

    // Disziplin-Auswahl (nur Disziplinen der gewählten Klasse)
    const diszs = [...new Set(karten.map(k => k.w.disziplin))];
    const di = diszs.includes(disziplin) ? disziplin : ALLE;
    optionen('selDisz', [[ALLE, 'Alle Disziplinen'], ...diszs.map(d => [d, d])], di);
    if (di !== ALLE) karten = karten.filter(k => k.w.disziplin === di);

    // Vereins-Auswahl (gewählter Verein bleibt immer drin)
    const vereine = new Set();
    karten.forEach(k => k.eintraege.forEach(e => e.verein && vereine.add(e.verein)));
    if (verein !== ALLE) vereine.add(verein);
    optionen('selVerein', [[ALLE, 'Alle Vereine'], ...[...vereine].sort((a, b) => a.localeCompare(b, 'de')).map(v => [v, v])], verein);
    if (verein !== ALLE) karten = karten
      .map(k => ({ ...k, eintraege: k.eintraege.filter(e => e.verein === verein) }))
      .filter(k => k.eintraege.length);

    // Namenssuche
    if (suche.trim()) karten = karten
      .map(k => ({ ...k, eintraege: k.eintraege.filter(passtZurSuche) }))
      .filter(k => k.eintraege.length);

    $('ergListe').innerHTML = karten.map(({ w, code, eintraege }) => {
      const gemeinsam = code === GESAMT;
      const titel = gemeinsam ? `${w.disziplin} ${A.codes(w).map(kurz).join(', ')}` : titelKlasse(w, code);
      const andere = A.codes(w).filter(c => c !== code);
      const kommentar = gemeinsam ? A.gesamtKommentar : (andere.length ? 'aus gemeinsamem Wettbewerb mit ' + andere.map(kurz).join(', ') : '');
      const gesamtzahl = gemeinsam ? null : A.proKlasse(w, code).length;
      return art === 'erg' ? ergebnisKarte(w, titel, eintraege, kommentar, gemeinsam)
                           : meldeKarte(w, titel, eintraege, kommentar, gemeinsam, gesamtzahl);
    }).join('') || `<div class="empty">${suche.trim() ? 'Kein Treffer für „' + esc(suche.trim()) + '“ in der aktuellen Auswahl.'
      : verein !== ALLE ? 'Nichts für diesen Verein in der aktuellen Auswahl.' : A.leer}</div>`;
    $('zuruecksetzen').hidden = kl === ALLE && di === ALLE && verein === ALLE && !suche.trim();
  }

  const personZelle = e => e.team
    ? `${esc(e.verein)}${e.mitglieder ? `<br><small>${esc(e.mitglieder)}</small>` : ''}`
    : `<button type="button" class="person" data-name="${esc(e.name)}" data-verein="${esc(e.verein)}" title="Alle Ergebnisse von ${esc(e.name)}">${esc(e.name)}</button>${e.jg ? ` <small>(${esc(e.jg)})</small>` : ''}<br><small>${esc(e.verein)}</small>`;

  function kartenRahmen(titel, tag, meta, kommentar, kopf, rows) {
    return `<div class="card">
      <div class="card-head"><h2>${esc(titel)}${tag}</h2><small>${esc(meta)}</small></div>
      ${kommentar ? `<div class="hint" style="margin:0 0 4px">${esc(kommentar)}</div>` : ''}
      <div class="tbl-wrap"><table><thead><tr>${kopf}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

  function ergebnisKarte(w, titel, eintraege, kommentar, mitKlasse) {
    const rows = eintraege.map(e => {
      // Medaillen-Symbol nur in der Klassenwertung (Gesamtwertung und Vorläufe geben keine Medaillen)
      const platz = e.rang ? (!w.vorlauf && !mitKlasse && e.rang <= 3 ? medal(e.rang) : e.rang) : '–';
      return `<tr><td class="n">${platz}</td><td class="name">${personZelle(e)}</td>
        ${mitKlasse ? `<td class="hide-sm">${esc(kurz(e.klasse))}</td>` : ''}
        <td class="r"><b>${esc(e.ergebnis)}</b></td></tr>`;
    }).join('');
    return kartenRahmen(titel, w.vorlauf ? '<span class="tag">Vorlauf – keine Medaillen</span>' : '',
      [w.runde, w.zeit && w.zeit + ' Uhr'].filter(Boolean).join(' · '), kommentar,
      `<th class="n">Pl.</th><th>Name / Verein</th>${mitKlasse ? '<th class="hide-sm">Klasse</th>' : ''}<th class="r">Leistung</th>`, rows);
  }

  function meldeKarte(w, titel, eintraege, kommentar, mitKlasse, anzahl) {
    const rows = eintraege.map(e => `<tr><td class="n">${esc(e.bib || '–')}</td><td class="name">${personZelle(e)}</td>
        ${mitKlasse ? `<td class="hide-sm">${esc(kurz(e.klasse))}</td>` : ''}
        <td class="r"><b>${esc(e.meldewert || '–')}</b></td></tr>`).join('');
    const n = anzahl ?? eintraege.length;
    return kartenRahmen(titel, '',
      [n + (n === 1 ? ' Meldung' : ' Meldungen'), w.zeit && w.zeit + ' Uhr'].filter(Boolean).join(' · '), kommentar,
      `<th class="n">Nr.</th><th>Name / Verein</th>${mitKlasse ? '<th class="hide-sm">Klasse</th>' : ''}<th class="r">Meldewert</th>`, rows);
  }

  // ---------- Ansicht / Laden ----------
  const SEITEN = { med: 'Medaillenspiegel', erg: 'Ergebnisse', meld: 'Meldungen' };
  // '08. Mrz 2026 Volksbank-Hallenkreismeisterschaft 2026 - Dresden' -> Name, Datum, Ort
  const MONATE = { Jan: 'Januar', Feb: 'Februar', Mrz: 'März', Apr: 'April', Mai: 'Mai', Jun: 'Juni', Jul: 'Juli',
                   Aug: 'August', Sep: 'September', Okt: 'Oktober', Nov: 'November', Dez: 'Dezember' };
  function kopf(t) {
    const m = (t || '').match(/^(.*?\b\d{4})\s+(.+?)(?:\s+-\s+((?:(?!\s-\s).)+))?$/);
    if (!m) return { name: t, datum: '', ort: '' };
    const datum = m[1].replace(/\b(Jan|Feb|Mrz|Apr|Mai|Jun|Jul|Aug|Sep|Okt|Nov|Dez)\b\.?/g, x => MONATE[x.replace('.', '')]);
    return { name: m[2], datum, ort: m[3] || '' };
  }

  function view() {
    return { '#ergebnisse': 'erg', '#meldungen': 'meld', '#beamer': 'beamer' }[location.hash] || 'med';
  }

  // ---------- Beamer: Medaillenspiegel und neueste Ergebnisse im Wechsel ----------
  let beamerSeite = 0, beamerTimer = null;
  function renderBeamer() {
    const k = kopf(data.wettkampf);
    $('bTitel').textContent = k.name;
    $('bOrt').textContent = [k.datum, k.ort].filter(Boolean).join(' · ');
    const seiten = [beamerMedaillen, beamerNeueste];
    beamerSeite %= seiten.length;
    $('bInhalt').innerHTML = seiten[beamerSeite]();
    $('bPunkte').innerHTML = seiten.map((_, i) => `<span class="${i === beamerSeite ? 'on' : ''}"></span>`).join('');
    // nur so viele Zeilen/Karten zeigen, wie auf den Bildschirm passen
    const zuHoch = () => document.documentElement.scrollHeight > window.innerHeight + 1;
    const teile = () => $('bInhalt').querySelectorAll('.b-tab tbody tr, .b-raster > .b-karte');
    while (zuHoch() && teile().length > 1) teile()[teile().length - 1].remove();
  }
  function beamerMedaillen() {
    const rows = spiegel().slice(0, 20);
    return `<div class="b-titel">Medaillenspiegel</div>` + (rows.length ? `<table class="b-tab"><thead><tr><th class="n">#</th><th>${CONFIG.mode === 'lv' ? 'Landesverband' : 'Verein'}</th>
      <th class="n">${medal(1).replace('>1<', '>G<')}</th><th class="n">${medal(2).replace('>2<', '>S<')}</th><th class="n">${medal(3).replace('>3<', '>B<')}</th><th class="n">Σ</th></tr></thead><tbody>${
      rows.map(r => `<tr><td class="n">${r.pos}</td><td>${esc(r.name)}</td><td class="n"><b>${r.g}</b></td><td class="n">${r.s}</td><td class="n">${r.b}</td><td class="n"><b>${r.g + r.s + r.b}</b></td></tr>`).join('')
    }</tbody></table>` : '<div class="empty">Noch keine Medaillen vergeben.</div>');
  }
  function beamerNeueste() {
    const karten = [];
    data.wettbewerbe.filter(w => freigegeben(w) && !w.vorlauf)
      .sort((a, b) => new Date(b.offiziell) - new Date(a.offiziell))
      .forEach(w => klassenCodes(w).forEach(c => karten.push({ w, c })));
    const neu = karten.slice(0, Math.max(CONFIG.beamerErgebnisse, 1));
    return `<div class="b-titel">Neueste Ergebnisse</div>` + (neu.length ? `<div class="b-raster">${neu.map(({ w, c }) => {
      const zeilen = w.klassen[c].filter(e => e.rang && e.rang <= 3).slice(0, 4);
      const uhr = new Date(w.offiziell).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      return `<div class="b-karte"><h2>${esc(titelKlasse(w, c))} <small>· offiziell ${uhr} Uhr</small></h2><table>${
        zeilen.map(e => `<tr><td style="width:2em">${medal(e.rang)}</td><td>${esc(e.team ? e.verein : e.name)}${e.team ? '' : ` <small>· ${esc(e.verein)}</small>`}</td><td class="r">${esc(e.ergebnis)}</td></tr>`).join('')
      }</table></div>`;
    }).join('')}</div>` : '<div class="empty">Noch keine Ergebnisse.</div>');
  }
  function beamerUhr() { $('bUhr').textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }

  function render() {
    const v = view();
    document.body.classList.toggle('beamer', v === 'beamer');
    if (v === 'beamer' && !beamerTimer) {
      beamerUhr();
      beamerTimer = setInterval(() => { beamerSeite++; if (data) renderBeamer(); beamerUhr(); }, CONFIG.beamerSekunden * 1000);
    } else if (v !== 'beamer' && beamerTimer) { clearInterval(beamerTimer); beamerTimer = null; }
    $('viewMed').hidden = v !== 'med';
    $('viewErg').hidden = v !== 'erg' && v !== 'meld';
    $('navMed').classList.toggle('on', v === 'med');
    $('navErg').classList.toggle('on', v === 'erg');
    $('navMeld').classList.toggle('on', v === 'meld');
    if (!data) return;
    const k = kopf(data.wettkampf);
    $('title').textContent = k.name;
    $('datumOrt').textContent = [k.datum, k.ort].filter(Boolean).join(' · ');
    document.title = (SEITEN[v] || 'Beamer') + ' – ' + k.name;
    if (v === 'med') renderMedaillen(); else if (v === 'beamer') renderBeamer(); else renderListe(v);
  }

  async function load() {
    // Beispieldatei: Daten sind direkt in der Seite eingebettet (kein Abruf nötig)
    if (window.EINGEBETTETE_DATEN) {
      data = window.EINGEBETTETE_DATEN;
      render();
      $('stand').textContent = 'Beispiel – Datenstand: ' + new Date(data.stand).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' Uhr';
      return;
    }
    try {
      let v = null;
      try {
        const rv = await fetch(CONFIG.versionQuelle + '?t=' + Date.now(), { cache: 'no-store' });
        if (rv.ok) v = await rv.json();
      } catch (e) { /* ältere Veröffentlichung ohne version.json */ }
      if (!v || v.version !== geladeneVersion) {
        // eindeutige Adresse je Version: darf vom Browser zwischengespeichert werden
        const res = await fetch(CONFIG.quelle + (v ? '?v=' + v.version : '?t=' + Date.now()), v ? {} : { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
        geladeneVersion = v ? v.version : null;
      }
      versionInfo = v;
      warnungPruefen();
      render();
      const t = new Date(data.stand);
      $('stand').textContent = 'Letzte Änderung: ' + t.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' Uhr';
    } catch (e) {
      console.warn('Medaillenspiegel: Laden fehlgeschlagen:', e.message);
      if (!data) $('stand').textContent = 'Ergebnisse konnten nicht geladen werden – neuer Versuch folgt.';
    }
  }

  let geladeneVersion = null, versionInfo = null;
  // Hinweis, wenn am Wettkampftag länger nichts aktualisiert wurde (Schleife bei GitHub abgerissen?)
  function warnungPruefen() {
    const v = versionInfo;
    const min = v && v.geprueft ? Math.floor((Date.now() - new Date(v.geprueft).getTime()) / 60000) : 0;
    const zeigen = !!v && v.modus === 'live' && min >= CONFIG.veraltetMinuten;
    $('warnung').hidden = !zeigen;
    if (zeigen) $('warnung').textContent = `Achtung: Die Daten wurden seit ${min} Minuten nicht mehr aktualisiert. Neue Ergebnisse fehlen möglicherweise.`;
  }

  async function loop() {
    await load();
    if (CONFIG.interval > 0 && !window.EINGEBETTETE_DATEN) setTimeout(loop, CONFIG.interval * 1000);
  }

  if (DESIGN.logo) {
    $('logo').src = $('bLogo').src = DESIGN.logo;
    $('logo').alt = $('bLogo').alt = DESIGN.name || '';
    if (DESIGN.link) $('logoLink').href = DESIGN.link; else $('logoLink').removeAttribute('href');
    $('logoLink').title = DESIGN.name || '';
    $('logoLink').hidden = $('bLogoRahmen').hidden = false;
  }

  window.addEventListener('hashchange', render);
  window.addEventListener('resize', () => { if (view() === 'beamer' && data) renderBeamer(); });
  $('selKlasse').onchange = e => { klasse = e.target.value; store.set('klasse', klasse); render(); };
  $('selDisz').onchange = e => { disziplin = e.target.value; store.set('disziplin', disziplin); render(); };
  $('suche').oninput = e => { suche = e.target.value; render(); };
  $('selVerein').onchange = e => { verein = e.target.value; store.set('verein', verein); render(); };
  $('ergListe').onclick = e => {
    const b = e.target.closest('button.person'); if (!b) return;
    klasse = ALLE; disziplin = ALLE; verein = b.dataset.verein || ALLE; suche = b.dataset.name;
    store.set('klasse', klasse); store.set('disziplin', disziplin); store.set('verein', verein);
    $('suche').value = suche;
    render();
    $('viewErg').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  $('zuruecksetzen').onclick = () => {
    klasse = disziplin = verein = ALLE; suche = ''; $('suche').value = '';
    store.set('klasse', klasse); store.set('disziplin', disziplin); store.set('verein', verein);
    render();
  };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && view() === 'beamer') location.hash = '#medaillen'; });
  document.addEventListener('dblclick', () => {
    if (view() !== 'beamer') return;
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {});
  });
  $('medBody').onclick = e => {
    const tr = e.target.closest('tr.main'); if (!tr) return;
    const k = tr.dataset.k; open.has(k) ? open.delete(k) : open.add(k); render();
  };

  render();
  loop();
})();
</script>
</body>
</html>
